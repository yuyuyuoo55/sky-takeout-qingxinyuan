services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: sky_take_out
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-qingxinyuan_dev_password}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/demo-data.sql:/docker-entrypoint-initdb.d/02-demo-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.2-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: sky_take_out
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-qingxinyuan_dev_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_DATABASE: 10
      JWT_ADMIN_SECRET: ${JWT_ADMIN_SECRET:-qingxinyuan-local-admin-jwt-secret-change-before-production}
      JWT_USER_SECRET: ${JWT_USER_SECRET:-qingxinyuan-local-user-jwt-secret-change-before-production}
      SHOP_ADDRESS: ${SHOP_ADDRESS:-DEMO_SHOP_ADDRESS}
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --output /dev/null http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  merchant-admin:
    build:
      context: ./merchant-admin
    environment:
      MERCHANT_HOST: 0.0.0.0
      MERCHANT_PORT: 8888
      BACKEND_HOST: backend
      BACKEND_PORT: 8080
    ports:
      - "127.0.0.1:8888:8888"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql-data:
