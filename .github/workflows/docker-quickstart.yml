name: Docker quick-start check

on:
  push:
  pull_request:

jobs:
  quick-start:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config

      - name: Start all services
        run: docker compose up --build -d

      - name: Wait for merchant page
        shell: bash
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8888/ > /dev/null; then
              exit 0
            fi
            sleep 3
          done
          echo "Merchant page did not become ready in time."
          exit 1

      - name: Verify demonstration login
        shell: bash
        run: |
          for attempt in {1..30}; do
            response="$(
              curl --silent \
                --request POST \
                --header "Content-Type: application/json" \
                --data '{"username":"admin","password":"123456"}' \
                http://127.0.0.1:8888/api/employee/login || true
            )"

            if printf '%s' "$response" \
              | jq --exit-status '.code == 1 and (.data.token | length > 0)' > /dev/null 2>&1; then
              exit 0
            fi

            sleep 3
          done

          echo "Demonstration login did not succeed in time."
          exit 1

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop services
        if: always()
        run: docker compose down -v
